# Site de documentation, publie sur GitHub Pages par .github/workflows/docs.yml.
#
# MkDocs n'est PAS une dependance de Romule : il n'est installe que dans le
# job de publication. La propriete « zero dependance » porte sur l'execution.
site_name: Romule
site_description: Self-hosted manager for the game library you already own
site_url: https://romule-app.github.io/romule/
repo_url: https://github.com/romule-app/romule
repo_name: romule-app/romule
edit_uri: edit/main/docs/
copyright: AGPL-3.0-or-later

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    # Le site suit le theme du lecteur, comme l'application elle-meme.
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Follow system }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle: { icon: material/brightness-7, name: Switch to dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle: { icon: material/brightness-4, name: Switch to light }

# Le site est bilingue. Le greffon n'est PAS une dependance de Romule : comme
# MkDocs lui-meme, il n'est installe que dans le job de publication — la
# propriete « zero dependance » porte sur l'execution.
#
# Une page sans traduction retombe sur l'anglais plutot que de disparaitre :
# mieux vaut une page lisible dans l'autre langue qu'un lien mort.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Getting started: Pour commencer
            Installation: Installation
            First run: Premier démarrage
            Your console: Ta console
            Reference: Référence
            Configuration: Configuration
            HTTP API: API HTTP
            Roles and access: Rôles et accès
            Emulator profiles: Profils d'émulateur
            Security and exposure: Sécurité et exposition
            Help: Aide
            Troubleshooting: Dépannage
            Beta features: Fonctions bêta
            Contributing: Contribuer

# `--strict` verifie les liens entre PAGES, pas les ancres a l'interieur
# d'une page : `securite.md#un-titre-qui-n-existe-plus` passait en silence, et
# le lecteur atterrissait en haut de la page sans comprendre pourquoi. Un
# titre renomme est exactement le genre de changement qui casse une ancre.
validation:
  anchors: warn
  unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  # `md_in_html` : sans elle, tout ce qui est place dans une balise HTML est
  # rendu TEL QUEL. La grille de cartes de la page d'accueil affichait donc son
  # markdown brut — les `**` et les `[lien](page.md)` visibles a l'ecran — et
  # `--strict` ne pouvait pas le voir : ce n'est pas un avertissement MkDocs,
  # c'est du texte qui s'affiche mal.
  - md_in_html
  - def_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - First run: premier-demarrage.md
      - Your console: console.md
  - Reference:
      - Configuration: configuration.md
      - HTTP API: api.md
      - Emulator profiles: profils.md
      - Roles and access: roles.md
      - Security and exposure: securite.md
  - Help:
      - Troubleshooting: depannage.md
      - Beta features: beta.md
      - Contributing: contribuer.md

not_in_nav: |
  images/
  openapi.json


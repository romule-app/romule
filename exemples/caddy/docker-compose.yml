# Romule derriere Caddy, en une commande.
#
#     docker compose up -d
#
# Ouvre http://localhost/ : l'assistant de premier demarrage s'affiche, et
# creer le premier compte revendique l'installation — apres quoi le reseau
# est refuse sans session.
#
# Puis http://localhost/ — Caddy ecoute sur le port 80, Romule n'est PAS
# publie : il n'est joignable que par le proxy. C'est le point de cet exemple.

services:
  caddy:
    image: caddy:2-alpine
    container_name: romule-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-donnees:/data
      - caddy-config:/config
    depends_on:
      - romule

  romule:
    image: ghcr.io/romule-app/romule:latest
    container_name: romule
    restart: unless-stopped
    # AUCUN `ports:`. Romule n'est joignable que depuis le reseau du compose,
    # donc uniquement par Caddy. Publier son port en plus reviendrait a laisser
    # une porte ouverte a cote de celle qu'on vient de proteger.
    environment:
      ROMULE_ROOT: /data
      ROMULE_BASES: /library

      # Un proxy fait paraitre TOUTES les requetes comme venant de lui.
      # Cette declaration autorise Romule a croire `X-Forwarded-For`, et donc
      # a consigner la VRAIE adresse de chaque client — dans le journal des
      # connexions, et pour le blocage apres echecs repetes. Sans elle, tout
      # le monde semblerait etre Caddy, et bloquer une adresse bloquerait tout
      # le monde.
      #
      # La notation CIDR est acceptee, et c'est ce qu'il faut ici : Docker
      # attribue l'adresse de Caddy dynamiquement, et une adresse fixe serait
      # fausse au premier `docker compose down`.
      ROMULE_TRUSTED_PROXIES: 172.16.0.0/12

      # Le mode d'acces se choisit dans l'assistant au premier demarrage.
      # ROMULE_LAN=1 ouvre sans mot de passe des le depart — a ne faire que
      # si Caddy porte lui-meme une authentification devant.
      # ROMULE_LAN: "1"

      TZ: Europe/Paris

    volumes:
      - romule-donnees:/data
      - ./library:/library      # ← tes jeux

volumes:
  caddy-donnees:
  caddy-config:
  romule-donnees:

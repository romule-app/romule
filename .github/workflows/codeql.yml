# Analyse de securite du code, Python ET JavaScript.
#
# C'est le seul controle qui regarde les 6 500 lignes du front. Jusqu'ici
# `node --check` en verifiait la SYNTAXE — ce qui ne dit rien d'une injection
# de HTML, d'un `postMessage` sans controle d'origine ou d'une redirection
# ouverte.
#
# CodeQL plutot qu'un service tiers : gratuit sur un depot public, sans compte
# ni secret a stocker, et — ce qui compte pour un projet qu'on va forker — il
# fonctionne sur les pull requests venant d'un fork, la ou un jeton de service
# ne serait pas expose.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 2"       # mardi : une regle nouvelle peut trouver du vieux code
  workflow_dispatch:

# Le scan de code demande GitHub Advanced Security sur un depot PRIVE. Tant
# que celui-ci l'est, l'analyse tourne jusqu'au bout puis echoue en deposant
# ses resultats — un echec rouge a chaque commit, pour une raison qui n'a rien
# a voir avec le code. Le garde ci-dessous la met en veille, et elle repart
# d'elle-meme le jour ou le depot devient public.
permissions:
  contents: read
  security-events: write       # depose les resultats dans l'onglet Security
  # Exigee sur un depot PRIVE, et seulement la : CodeQL interroge l'API des
  # executions pour rattacher son analyse a la bonne. Sans elle, l'analyse va
  # jusqu'au bout puis echoue a la derniere etape sur « Resource not accessible
  # by integration », ce qui ne ressemble en rien a un probleme de droits.
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: ${{ matrix.langue }}
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        langue: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialisation
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.langue }}
          # `security-and-quality` plutot que le jeu par defaut : le supplement
          # porte sur la qualite, et ce depot n'a pas de dette a rattraper.
          queries: security-and-quality

      # Rien a construire : ni compilation Python, ni empaquetage du front.
      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: /langue:${{ matrix.langue }}

# Site de documentation, publie sur GitHub Pages.
#
# Il est CONSTRUIT sur chaque pull request et seulement PUBLIE depuis `main` :
# un lien casse doit se voir avant la fusion, pas apres.
#
# `--strict` transforme tout avertissement de MkDocs en echec. Sans lui, un
# lien interne mort passe en silence et se decouvre par un lecteur.
#
# MkDocs et Material sont epingles A LA VERSION, et pas seulement au majeur :
# l'equipe de Material annonce que MkDocs 2.0 supprimera le systeme de
# greffons, sans chemin de migration. Une construction non epinglee casserait
# le jour de cette publication.
name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    name: Construction (stricte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }

      - name: Installation
        run: pip install --quiet mkdocs==1.6.1 mkdocs-material==9.7.7 mkdocs-static-i18n==1.3.0

      - name: Construction
        run: mkdocs build --strict

      # `--strict` attrape les liens morts, pas le markdown qui s'affiche en
      # clair. Une extension manquante, une admonition mal indentee ou un
      # onglet mal ferme ne sont pas des avertissements de MkDocs : ce sont des
      # pages qui se lisent mal, et rien ne les regardait.
      - name: Le site affiche-t-il du markdown en clair ?
        run: python3 outils/verifier-rendu.py

      # Le site est bilingue. Une page ajoutee dans une seule langue ne
      # disparait pas — le greffon retombe sur l'anglais — mais elle cesse
      # silencieusement d'etre traduite, et personne ne s'en apercoit. Ce
      # controle demande donc une decision explicite : traduire, ou dire
      # pourquoi on ne traduit pas.
      - name: Chaque page a-t-elle sa traduction ?
        run: |
          python - <<'PY'
          import pathlib, sys
          docs = pathlib.Path("docs")
          # Ce qui reste volontairement dans une seule langue, avec sa raison.
          EXCEPTIONS = {}
          en = {p.stem for p in docs.glob("*.md") if not p.name.endswith(".fr.md")}
          fr = {p.name[:-6] for p in docs.glob("*.fr.md")}
          manquantes = sorted(en - fr - set(EXCEPTIONS))
          orphelines = sorted(fr - en)
          for k in manquantes:
              print("::error title=Page non traduite::docs/%s.md n'a pas de "
                    "docs/%s.fr.md" % (k, k))
          for k in orphelines:
              print("::error title=Traduction orpheline::docs/%s.fr.md traduit "
                    "une page qui n'existe pas" % k)
          print("%d pages, %d traduites." % (len(en), len(en & fr)))
          sys.exit(1 if manquantes or orphelines else 0)
          PY

      # Une page traduite peut exister ET avoir cesse de suivre l'originale :
      # une section ajoutee d'un cote, un tableau enrichi de l'autre. La
      # STRUCTURE se compare sans lire la langue — titres, tableaux, encadres —
      # et un ecart signale une traduction restee en arriere.
      - name: Les traductions suivent-elles la page d'origine ?
        run: |
          python - <<'PY'
          import pathlib, re, sys
          docs = pathlib.Path("docs")
          def profil(p):
              t = p.read_text(encoding="utf-8")
              return (len(re.findall(r"^##+ ", t, re.M)),
                      len(re.findall(r"^\|", t, re.M)),
                      len(re.findall(r"^!!! ", t, re.M)),
                      len(re.findall(r"^```", t, re.M)))
          NOMS = ("titres", "lignes de tableau", "encadres", "delimiteurs de code")
          ecarts = 0
          for en in sorted(docs.glob("*.md")):
              if en.name.endswith(".fr.md"):
                  continue
              fr = docs / (en.stem + ".fr.md")
              if not fr.exists():
                  continue
              a, b = profil(en), profil(fr)
              if a == b:
                  continue
              ecarts += 1
              detail = ", ".join("%s %d/%d" % (n, x, y)
                                 for n, x, y in zip(NOMS, a, b) if x != y)
              print("::error file=docs/%s::la traduction a derive : %s"
                    % (fr.name, detail))
          print("%d ecart(s) de structure." % ecarts)
          sys.exit(1 if ecarts else 0)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: site, path: site/ }

  publier:
    name: Publication sur GitHub Pages
    needs: construire
    # GitHub Pages n'existe pas sur un depot PRIVE au plan gratuit. La
    # construction, elle, tourne toujours : c'est elle qui attrape un lien mort
    # ou un reglage non documente. Seule la publication attend le passage en
    # public, et repart d'elle-meme ce jour-la.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install --quiet mkdocs==1.6.1 mkdocs-material==9.7.7 mkdocs-static-i18n==1.3.0
      - run: mkdocs build --strict
      # `enablement: true` : sans cela l'action echoue tant que Pages n'a pas
      # ete active a la main dans les reglages du depot — ce qui rend le
      # workflow inutilisable tel quel pour qui duplique le projet. Avec, la
      # premiere execution l'active elle-meme.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with: { path: site/ }
      - id: pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

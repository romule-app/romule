# Audit de securite au deploiement.
#
# Le job echoue si l'audit remonte un point GRAVE (code 2). Une simple alerte
# (code 1) laisse passer mais reste visible dans le resume : bloquer sur une
# alerte pousserait a la desactiver, ce qui est pire.
#
# `bandit` et `pip-audit` ne sont PAS des dependances du projet : ils sont
# installes ici seulement, dans le pipeline. Le projet lui-meme reste a zero
# dependance, ce que l'audit verifie de son cote.
name: Audit de securite

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"        # tous les lundis : une CVE peut sortir sans commit
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilation de tous les modules
        run: python -m compileall -q switchlib switch.py

      - name: Audit interne (posture, code, dependances, version de Python)
        run: |
          python -m switchlib.audit --json > audit.json || true
          python -m switchlib.audit
          python - <<'PY'
          import json, sys
          r = json.load(open("audit.json"))
          graves = [c for c in r["controles"] if c["niveau"] == "grave"]
          for c in graves:
              print("::error title=%s::%s" % (c["titre"], c["constat"]))
          for c in r["controles"]:
              if c["niveau"] == "alerte":
                  print("::warning title=%s::%s" % (c["titre"], c["constat"]))
          sys.exit(1 if graves else 0)
          PY

      - name: Analyse statique (bandit)
        run: |
          pip install --quiet bandit
          bandit -q -r switchlib -f screen --severity-level medium

      - name: Vulnerabilites connues des paquets installes (pip-audit)
        run: |
          pip install --quiet pip-audit
          pip-audit --strict --progress-spinner off

      - name: Syntaxe du front
        run: |
          node --check switchlib/static/app.js
          node --check switchlib/static/reactive.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-audit
          path: audit.json

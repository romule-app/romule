# Construction et publication de l'image.
#
# L'image est CONSTRUITE a chaque pull request, et seulement PUBLIEE au tag.
# Sans cela, la premiere construction reelle serait la publication elle-meme —
# c'est-a-dire le pire moment pour decouvrir qu'un paquet manque en arm64.
#
# Les deux architectures visees couvrent l'essentiel des machines de destination :
# amd64 pour un mini-PC ou un NAS x86, arm64 pour un Raspberry Pi, un NAS ARM ou
# un Mac. Les trois paquets Python compiles necessaires (pycryptodome, zstandard)
# publient des roues manylinux aarch64 ; enlighten est du Python pur. Aucun
# compilateur n'est donc necessaire dans l'image.
name: Image Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Construire${{ startsWith(github.ref, 'refs/tags/v') && ' et publier' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # arm64 sur un runner x86
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Authentification au registre
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquettes et versions
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Construction
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Sur une pull request, l'image reste dans le cache de buildx : on
          # veut savoir qu'elle SE CONSTRUIT, pas la conserver.
          load: false

  # L'image se construit-elle ET demarre-t-elle ? Une image qui se construit
  # mais dont le service ne repond jamais passe toutes les etapes ci-dessus.
  fumee:
    name: L'image demarre et repond
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Construction locale (amd64 seul, pour pouvoir la lancer)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: romule:fumee
          cache-from: type=gha

      # La vraie surface de vulnerabilites de Romule n'est pas son code — il
      # n'a aucune dependance — mais son IMAGE : l'image de base, trois paquets
      # apt et les dependances compilees de nsz. Rien ne la regardait.
      #
      # Averti seulement : une CVE sans correctif publie dans debian:trixie ne
      # se corrige pas de ce cote, et bloquer dessus reviendrait a ne plus
      # pouvoir publier pour une raison qui ne nous appartient pas.
      - name: Vulnerabilites de l'image (avertissement)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true
        with:
          image-ref: romule:fumee
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true          # sans correctif disponible, rien a faire
          exit-code: "0"
          output: trivy.txt

      - name: Resume des vulnerabilites
        if: always()
        run: |
          {
            echo '### Vulnerabilites de l'"'"'image (HIGH et CRITICAL corrigeables)'
            echo '```'
            cat trivy.txt 2>/dev/null || echo "(aucun rapport)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Demarrage sur une ludotheque vide
        run: |
          mkdir -p /tmp/ludo /tmp/cles
          # Volume NOMME pour /data, comme le fichier compose : Docker le cree
          # avec le proprietaire de l'image. Un dossier de l'hote monte a la
          # place appartient a l'UID de l'hote, et l'image tourne sous 1000 —
          # c'est le piege que l'etape suivante verifie explicitement.
          docker volume create romule-donnees
          docker run -d --name romule \
            -p 8787:8787 \
            -v romule-donnees:/data -v /tmp/ludo:/library -v /tmp/cles:/keys \
            romule:fumee

      # Le premier passage de ce test a fait tomber le service sur une trace de
      # pile : `mkdir` du depot sans filet, sur un montage appartenant a un
      # autre UID. Un operateur y lisait « Permission denied » sans savoir de
      # qui ni sur quoi. Le message doit nommer le remede.
      - name: Un dossier non inscriptible explique au lieu de planter
        run: |
          # Le cas REEL : un dossier de l'hote parfaitement lisible, mais qui
          # appartient a l'utilisateur du runner (1001) et non a celui de
          # l'image (1000). `chmod 500` testait autre chose — un dossier ou le
          # processus ne peut meme pas faire un `stat`, ce qui est plus rare.
          # Les deux sont verifies, dans cet ordre.
          mkdir -p /tmp/pas-a-nous
          sortie=$(docker run --rm -v /tmp/pas-a-nous:/data romule:fumee 2>&1 || true)
          echo "--- proprietaire different ---"
          echo "$sortie"
          if echo "$sortie" | grep -q "Traceback"; then
            echo "::error::trace de pile sur un dossier appartenant a un autre UID"
            exit 1
          fi
          echo "$sortie" | grep -q "n'est pas inscriptible" \
            || { echo "::error::pas de message explicite"; exit 1; }

          mkdir -p /tmp/interdit && chmod 500 /tmp/interdit
          echo "--- inaccessible ---"
          sortie=$(docker run --rm -v /tmp/interdit:/data romule:fumee 2>&1 || true)
          echo "$sortie"
          if echo "$sortie" | grep -q "Traceback"; then
            echo "::error::le service meurt sur une trace de pile au lieu d'expliquer"
            exit 1
          fi
          echo "$sortie" | grep -q "n'est pas inscriptible" \
            || { echo "::error::pas de message explicite"; exit 1; }
          echo "$sortie" | grep -q "1000:1000" \
            || { echo "::error::le remede n'est pas nomme"; exit 1; }

      - name: La sonde de sante passe-t-elle au vert ?
        run: |
          for i in $(seq 1 60); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' romule 2>/dev/null || echo absent)
            [ "$etat" = "healthy" ] && echo "sain apres ${i}s" && exit 0
            [ "$etat" = "unhealthy" ] && break
            sleep 1
          done
          echo "::error::le conteneur n'est jamais devenu sain (etat : $etat)"
          docker logs romule
          exit 1

      # `/api/health` n'est PAS public : un service joignable par le reseau le
      # refuse sans jeton, et c'est voulu — il annonce la version, le mode
      # d'authentification, le nombre de comptes et l'emplacement des cles.
      # La sonde Docker, elle, interroge la boucle locale a l'INTERIEUR du
      # conteneur, donc elle passe. C'est ce test qui affirmait le contraire.
      - name: Sans jeton, la sante est refusee depuis le reseau
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/health)
          echo "sans jeton : HTTP $code"
          [ "$code" = "403" ] || { echo "::error::attendu 403, obtenu $code"; exit 1; }

      - name: Le service repond, et il repond du bon
        run: |
          jeton=$(docker logs romule 2>&1 | grep -o 'token=[A-Za-z0-9_-]*' | head -1 | cut -d= -f2)
          if [ -z "$jeton" ]; then
            echo "::error::aucun jeton d'acces dans le journal du conteneur"
            docker logs romule
            exit 1
          fi
          curl -fsS "http://127.0.0.1:8787/api/health?token=$jeton" | tee sante.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("sante.json"))
          erreurs = []
          if not d.get("ok"):
              erreurs.append("/api/health ne dit pas ok")
          if d.get("version", "").count(".") != 2:
              erreurs.append("version absente ou malformee : %r" % d.get("version"))
          # L'etat du service et les jeux ne partagent plus le meme dossier :
          # une image qui les remelangerait ferait reapparaitre la
          # configuration et les comptes au milieu de la ludotheque.
          if d["root"] != "/data":
              erreurs.append("racine de service inattendue : %r" % d["root"])
          if d["ludotheque"] != "/data":
              erreurs.append("ludotheque par defaut inattendue : %r" % d["ludotheque"])
          if d.get("ludotheque_imposee"):
              erreurs.append("la ludotheque ne doit pas etre verrouillee par defaut")
          if not d["checks"]["adb"]:
              erreurs.append("adb absent de l'image")
          if not d["checks"]["nsz"]:
              erreurs.append("nsz absent de l'image")
          # `container` vit dans `checks`, pas a la racine. L'assertion avait
          # ete ecrite de memoire et n'avait jamais tourne : ecrite juste, elle
          # aurait dit « le conteneur ne se reconnait pas » alors qu'il se
          # reconnait tres bien.
          if not d["checks"].get("container"):
              erreurs.append("le conteneur ne se reconnait pas comme tel")
          for e in erreurs:
              print("::error title=Fumee::%s" % e)
          print("version %s, donnees %s, ludotheque %s, adb %s, nsz %s"
                % (d.get("version"), d["root"], d["ludotheque"],
                   d["checks"]["adb"], d["checks"]["nsz"]))
          sys.exit(1 if erreurs else 0)
          PY

      # Le blocage que ce test existe pour empecher : un conteneur joignable
      # mais qui refuse tout le monde, sans moyen d'atteindre les reglages.
      - name: Sans jeton, la page est refusee
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/)
          echo "sans jeton : HTTP $code"
          [ "$code" = "403" ] || { echo "::error::attendu 403, obtenu $code"; exit 1; }

      - name: Avec le jeton du journal, la page est servie
        run: |
          jeton=$(docker logs romule 2>&1 | grep -o 'token=[A-Za-z0-9_-]*' | head -1 | cut -d= -f2)
          if [ -z "$jeton" ]; then
            echo "::error::aucun jeton d'acces dans le journal du conteneur"
            docker logs romule
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8787/?token=$jeton")
          echo "avec jeton : HTTP $code"
          [ "$code" = "200" ] || { echo "::error::attendu 200, obtenu $code"; exit 1; }

      - name: Le service ne tourne pas en root
        run: |
          qui=$(docker exec romule id -un)
          echo "utilisateur du conteneur : $qui"
          [ "$qui" = "romule" ] || { echo "::error::le conteneur tourne en $qui"; exit 1; }

      # `docker compose up` est la PREMIERE commande du README, et elle
      # n'etait testee nulle part : les etapes precedentes utilisent
      # `docker run`. Le fichier compose a sa propre forme — volume nomme pour
      # /data, montage pour les jeux, `ROMULE_BASES` — et rien ne garantissait
      # qu'elle tienne.
      - name: La pile compose monte, et le navigateur reste dans le montage
        run: |
          docker rm -f romule                    # le compose reclame ce nom
          mkdir -p library keys
          # On epingle l'image deja construite et on interdit la
          # reconstruction : `build: !reset null` marcherait aussi, mais il
          # demande une version recente du format. `--no-build` est compris
          # partout, et l'intention est plus lisible.
          cat > /tmp/epingle.yml <<'YML'
          services:
            romule:
              image: romule:fumee
          YML
          docker compose -p fumee -f docker-compose.yml -f /tmp/epingle.yml \
            up -d --no-build
          for i in $(seq 1 60); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' romule 2>/dev/null || echo absent)
            [ "$etat" = "healthy" ] && break
            sleep 1
          done
          if [ "$etat" != "healthy" ]; then
            echo "::error::la pile compose n'est jamais devenue saine ($etat)"
            docker compose -p fumee logs
            exit 1
          fi
          jeton=$(docker compose -p fumee logs romule 2>&1 \
                  | grep -o 'token=[A-Za-z0-9_-]*' | head -1 | cut -d= -f2)
          curl -s -c /tmp/pot -o /dev/null "http://127.0.0.1:8787/?token=$jeton"
          curl -s -b /tmp/pot -H "Origin: http://127.0.0.1:8787" \
               -H "Content-Type: application/json" -d '{}' \
               http://127.0.0.1:8787/api/parcourir -o parcours.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("parcours.json"))
          erreurs = []
          # Le point de depart : la ludotheque vaut /data par defaut, hors des
          # bases. Sans le repli, ouvrir la fenetre repondrait « hors des
          # dossiers autorises » a quelqu'un qui n'a rien demande.
          if d.get("chemin") != "/library":
              erreurs.append("depart attendu /library, recu %r" % (d.get("chemin") or d.get("error")))
          hors = [x["chemin"] for x in d.get("raccourcis", [])
                  if not x["chemin"].startswith("/library")]
          if hors:
              erreurs.append("raccourcis hors du montage : %r" % hors)
          for e in erreurs:
              print("::error title=Compose::%s" % e)
          sys.exit(1 if erreurs else 0)
          PY
          docker compose -p fumee down -v

      - name: Journal du conteneur
        if: always()
        run: docker logs romule || true

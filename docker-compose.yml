services:
  romule:
    # Ce fichier CONSTRUIT depuis les sources, parce qu'il vit dans le depot :
    # qui l'a clone veut voir tourner ce qu'il vient de lire. Pour installer
    # Romule sans cloner, remplacer cette ligne par :
    #     image: ghcr.io/romule-app/romule:latest
    build: .
    container_name: romule
    restart: unless-stopped

    # Reseau ordinaire, et un port publie : ce fichier doit marcher partout,
    # y compris sous Docker Desktop (macOS, Windows) ou `network_mode: host`
    # n'existe pas.
    #
    # adb par Wi-Fi fonctionne dans ce mode : le conteneur atteint le reseau
    # local, il suffit de saisir l'adresse de la console une fois.
    #
    # Pour que la console soit DECOUVERTE toute seule (mDNS), il faut le
    # reseau de l'hote — Linux uniquement. Remplacer alors les deux lignes
    # `ports:` par :
    #     network_mode: host
    ports:
      - "8787:8787"

    environment:
      # Etat du service dans le conteneur (ne pas changer) : configuration,
      # comptes, jaquettes, journaux. Il vit dans le volume nomme ci-dessous.
      ROMULE_ROOT: /data
      # Ou l'interface a le droit d'aller chercher des jeux. Le dossier exact
      # se DESIGNE DEPUIS L'INTERFACE, a la premiere ouverture : c'est la
      # seule information que le fichier compose ne peut pas connaitre.
      #
      # Tu ranges tes plateformes dans plusieurs dossiers d'un meme disque ?
      # Monte le parent (voir `volumes:`) et choisis a l'interieur.
      ROMULE_BASES: /library
      # Deploiement gere, ou plusieurs administrateurs : figer le dossier des
      # jeux et interdire d'en changer depuis l'interface.
      # ROMULE_LIBRARY: /library
      ROMULE_WEB_PORT: "8787"

      # RIEN N'EST A REGLER ICI POUR DEMARRER.
      #
      # Au premier lancement, Romule engendre un jeton d'acces et l'affiche
      # avec l'adresse complete :
      #     docker compose logs romule
      # Ouvre cette adresse, cree ton compte dans l'assistant, et c'est fait.
      # Le jeton est conserve : il ne change pas au redemarrage.
      #
      # Pour imposer le tien plutot que celui engendre :
      #     python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      # ROMULE_TOKEN: ""
      #
      # Reseau de confiance et personne d'autre dessus ? On peut se passer de
      # jeton — mais alors tout appareil du reseau a tous les droits.
      # ROMULE_LAN: "1"

      TZ: Europe/Paris

    volumes:
      # L'etat du service. Un volume nomme, et pas un dossier de l'hote : ces
      # fichiers ne sont pas les tiens au meme titre que tes jeux, et ils n'ont
      # rien a faire au milieu d'eux. Les supprimer, c'est repartir a neuf.
      - romule-donnees:/data
      # Tes jeux  ->  /library. Monte le dossier qui les contient, ou leur
      # dossier PARENT si tu veux choisir plus finement depuis l'interface.
      - ./library:/library
      # Le dossier contenant prod.keys  ->  /keys (lecture seule)
      - ./keys:/keys:ro

    # L'image tourne deja sous l'utilisateur 1000. Si le tien porte un autre
    # identifiant, adapte ici (id -u / id -g) pour que les fichiers deposes
    # t'appartiennent.
    # user: "1000:1000"

    # USB plutot que Wi-Fi (Linux uniquement, et cela affaiblit l'isolation du
    # conteneur — a n'activer qu'en connaissance de cause) :
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

volumes:
  romule-donnees:

services:
  ludotheque:
    build: .
    container_name: ludotheque
    restart: unless-stopped

    # Reseau ordinaire, et un port publie : ce fichier doit marcher partout,
    # y compris sous Docker Desktop (macOS, Windows) ou `network_mode: host`
    # n'existe pas.
    #
    # adb par Wi-Fi fonctionne dans ce mode : le conteneur atteint le reseau
    # local, il suffit de saisir l'adresse de la console une fois.
    #
    # Pour que la console soit DECOUVERTE toute seule (mDNS), il faut le
    # reseau de l'hote — Linux uniquement. Remplacer alors les deux lignes
    # `ports:` par :
    #     network_mode: host
    ports:
      - "8787:8787"

    environment:
      # Emplacement de la ludotheque DANS le conteneur (ne pas changer).
      ROMULE_ROOT: /library
      ROMULE_WEB_PORT: "8787"

      # Service accessible 24/7 : protege-le par un jeton.
      #
      # Aucune valeur par defaut n'est fournie, et c'est deliberé : un jeton
      # ecrit dans un depot public n'est pas un secret, c'est une porte
      # ouverte pour quiconque a lu le README. Genere le tien :
      #     python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      # puis decommente la ligne suivante en y collant le resultat.
      # ROMULE_TOKEN: ""
      #
      # L'adresse a ouvrir devient http://<serveur>:8787/?token=<ton-jeton>
      # (le navigateur le memorise ensuite).

      # Sans jeton, mets plutot ROMULE_LAN=1 pour ouvrir l'acces au reseau
      # local — a reserver a un reseau de confiance.
      # ROMULE_LAN: "1"

      TZ: Europe/Paris

    volumes:
      # Ta ludotheque sur le NAS  ->  /library
      - ./library:/library
      # Le dossier contenant prod.keys  ->  /root/.switch
      - ./keys:/keys:ro

    # L'image tourne deja sous l'utilisateur 1000. Si le tien porte un autre
    # identifiant, adapte ici (id -u / id -g) pour que les fichiers deposes
    # t'appartiennent.
    # user: "1000:1000"

    # USB plutot que Wi-Fi (Linux uniquement, et cela affaiblit l'isolation du
    # conteneur — a n'activer qu'en connaissance de cause) :
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
